[project]
name = "llmops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aryan Shah", email = "aryanrshah2109@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19",
    "streamlit>=1.66.1",
]

[project.scripts]
llmops = "llmops:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
